name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          tar -C . -cf - --exclude .git --exclude _site --exclude .github . | tar -C _site -xf -
          test -s _site/index.html
          test -s _site/brand/logo.webp
          test -s _site/downloads/DeRueda-arm64-v8a.apk
          test -s _site/downloads/DeRueda-armeabi-v7a.apk
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
